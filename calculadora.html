<head>
  <link rel="stylesheet" href="style.css">
  <style>
    .calc { max-width: 300px; margin: 20px auto; background: #161b22; padding: 20px; border-radius: 12px; border: 1px solid #30363d; }
    #display { width: 100%; height: 50px; background: #0d1117; color: #58a6ff; font-size: 28px; text-align: right; border: 1px solid #30363d; border-radius: 8px; padding: 5px 10px; margin-bottom: 15px; box-sizing: border-box; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .buttons button { height: 60px; font-size: 20px; border: none; border-radius: 8px; background: #21262d; color: white; font-weight: bold; }
    .buttons button.op { background: #1f6feb; }
    .buttons button.eq { background: #238636; grid-column: span 2; }
    .buttons button.clear { background: #da3633; }
  </style>
</head>
<body>
  <h1>Calculadora 🧮</h1>
  <p>Feita por Paulo no celular</p>
  
  <div class="calc">
    <input type="text" id="display" disabled>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="appendValue('/')">/</button>
      <button onclick="appendValue('*')">×</button>
      <button onclick="deleteLast()">⌫</button>
      
      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="op" onclick="appendValue('-')">-</button>
      
      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="op" onclick="appendValue('+')">+</button>
      
      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="appendValue('0')">0</button>
      
      <button onclick="appendValue('.')">.</button>
      <button class="eq" onclick="calculate()">=</button>
    </div>
  </div>

  <a class="btn" href="index.html">← Voltar</a>

  <script>
    function appendValue(val) { document.getElementById('display').value += val; }
    function clearDisplay() { document.getElementById('display').value = ''; }
    function deleteLast() { let d = document.getElementById('display'); d.value = d.value.slice(0, -1); }
    function calculate() {
      try {
        let result = eval(document.getElementById('display').value);
        document.getElementById('display').value = result;
      } catch { document.getElementById('display').value = 'Erro'; }
    }
  </script>
</body>
